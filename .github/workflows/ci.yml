name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amigo
          POSTGRES_PASSWORD: amigo_ci_pw
          POSTGRES_DB: amigo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amigo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://amigo:amigo_ci_pw@localhost:5432/amigo_test
      TEST_DATABASE_URL: postgresql://amigo:amigo_ci_pw@localhost:5432/amigo_test
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-0123456789abcdefghijkl
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Dependency audit (production packages)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npx next build
