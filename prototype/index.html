<title>Amigo Cash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sidebar + content on desktop, bottom tab bar on phones; admin is an RTL control room with the same tokens. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --line:#DFE2E9; --fg:#151823; --muted:#5F6678;
  --accent:#FF5A36; --accent-ink:#FFFFFF; --accent-soft:#FFE7E0;
  --coin:#D99A00; --coin-soft:#FFF3D3; --coin-face:#FFC21A;
  --good:#118A47; --good-soft:#DCF4E6; --warn:#A86A00; --warn-soft:#FFF0D2; --bad:#C93030; --bad-soft:#FCE1E1; --info:#2F5BD8; --info-soft:#E2E9FF;
  --ink-band:#151823; --ink-band-fg:#F3F4F7;
  --shadow:0 1px 2px rgba(21,24,35,.06),0 8px 24px rgba(21,24,35,.06);
  --f-display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --f-ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1016; --surface:#161922; --surface-2:#1E222D; --line:#2A2F3C; --fg:#ECEEF4; --muted:#949AAD;
  --accent:#FF6B48; --accent-ink:#FFFFFF; --accent-soft:#3B1D15;
  --coin:#FFC233; --coin-soft:#3A2E10; --coin-face:#FFC21A;
  --good:#3FD07F; --good-soft:#12301F; --warn:#F2B443; --warn-soft:#3A2B0D; --bad:#FF6B6B; --bad-soft:#3A1717; --info:#7C9BFF; --info-soft:#1A2448;
  --ink-band:#1E222D; --ink-band-fg:#ECEEF4; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1016; --surface:#161922; --surface-2:#1E222D; --line:#2A2F3C; --fg:#ECEEF4; --muted:#949AAD;
  --accent:#FF6B48; --accent-ink:#FFFFFF; --accent-soft:#3B1D15;
  --coin:#FFC233; --coin-soft:#3A2E10; --coin-face:#FFC21A;
  --good:#3FD07F; --good-soft:#12301F; --warn:#F2B443; --warn-soft:#3A2B0D; --bad:#FF6B6B; --bad-soft:#3A1717; --info:#7C9BFF; --info-soft:#1A2448;
  --ink-band:#1E222D; --ink-band-fg:#ECEEF4; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.hide-sm{}
[dir="ltr"]{unicode-bidi:isolate}

/* coin glyph */
.coin{display:inline-grid;place-items:center;width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE38A,var(--coin-face) 55%,#D48A00);color:#6B4300;font:800 .62em/1 var(--f-display);vertical-align:-.14em;box-shadow:inset 0 -1px 0 rgba(0,0,0,.2);flex:none}
.amt{display:inline-flex;align-items:center;gap:.3em;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;background:var(--surface-2);color:var(--fg);text-decoration:none;transition:transform .12s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.lg{padding:14px 26px;font-size:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.input,select.input,textarea.input{width:100%;padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--good)}
.switch input:checked+span::after{inset-inline-start:21px}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.flat{box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.coin{background:var(--coin-soft);color:var(--coin)}
.cc{display:inline-block;font:700 11px/1 var(--f-mono);padding:3px 5px;border-radius:5px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:12px;font-weight:700;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
td.r,th.r{text-align:end}

/* ===== landing ===== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:16px;height:64px;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:inline-flex;align-items:baseline;gap:6px;font:800 23px/1 var(--f-display);letter-spacing:-.03em;text-decoration:none;color:var(--fg);cursor:pointer}
.logo b{font-weight:800}
.logo i{font-style:normal;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:4px 7px 3px;border-radius:6px;transform:translateY(-3px)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ticker{background:var(--ink-band);color:var(--ink-band-fg);overflow:hidden;white-space:nowrap;font-size:13px}
.ticker-in{display:flex;gap:28px;padding-block:9px;animation:tick 40s linear infinite;width:max-content}
.ticker-item{display:inline-flex;align-items:center;gap:8px;opacity:.92}
.ticker-item .amt{color:var(--coin-face)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-in{animation:none}}

.hero{padding-block:56px 40px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(40px,6vw,72px);font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lede{font-size:18px;color:var(--muted);max-width:520px;margin-top:18px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.proofrow{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px}
.proofrow div{display:flex;flex-direction:column}
.proofrow strong{font:800 26px/1.1 var(--f-display)}
.proofrow span{font-size:13px;color:var(--muted)}

.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow);max-width:400px;margin-inline:auto;width:100%}
.phone .offer-head{display:flex;gap:14px;align-items:center}
.ms{display:flex;flex-direction:column;gap:0;margin-top:16px}
.ms-item{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 0;position:relative}
.ms-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1}
.ms-item.done .ms-dot{background:var(--good);border-color:var(--good);color:#fff}
.ms-item.next .ms-dot{border-color:var(--accent)}
.ms-item:not(:last-child)::before{content:"";position:absolute;left:10px;top:32px;bottom:-12px;width:2px;background:var(--line)}
[dir="rtl"] .ms-item:not(:last-child)::before{left:auto;right:10px}
.ms-item.done:not(:last-child)::before{background:var(--good)}
.ms-dot svg{width:12px;height:12px;stroke-width:3}

.section{padding-block:56px}
.section h2{font-size:clamp(28px,3.6vw,40px);font-weight:800;letter-spacing:-.025em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.step{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.step .n{font:800 15px/1 var(--f-mono);color:var(--accent)}
.step h3{font-size:21px;margin-top:14px}
.step p{color:var(--muted);margin-top:8px}
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:24px}
.method{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.mlogo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 11px/1 var(--f-display);letter-spacing:-.01em;flex:none;text-align:center}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font:700 20px/1 var(--f-mono);color:var(--accent)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin-top:10px;color:var(--muted);max-width:68ch}
.footer{border-top:1px solid var(--line);padding-block:28px;margin-top:24px;font-size:13px;color:var(--muted)}
.banner{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;text-align:center;padding:9px 16px}

/* ===== app shell ===== */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100% - 64px)}
.side{border-inline-end:1px solid var(--line);background:var(--surface);padding:18px 12px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 64px);overflow:auto;display:flex;flex-direction:column;gap:2px}
.navlink{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;border:0;background:none;width:100%;text-align:start}
.navlink:hover{background:var(--surface-2);color:var(--fg)}
.navlink.on{background:var(--accent-soft);color:var(--accent)}
.navlink .badge{margin-inline-start:auto;font:700 11px/1 var(--f-mono);background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:99px}
.side .sep{height:1px;background:var(--line);margin:10px 6px}
.main{min-width:0;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(26px,3vw,34px);font-weight:800}
.balance-chip{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:99px;background:var(--surface-2);font-weight:700}
.balance-chip .amt{font-size:15px}
.balance-chip .btn{padding:7px 14px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 14px/1 var(--f-display);color:#fff;flex:none;cursor:pointer;border:0}
.bottomnav{display:none}

.walletbar{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.walletbar>div{padding:16px 18px;border-inline-end:1px solid var(--line);min-width:0}
.walletbar>div:last-child{border-inline-end:0}
.walletbar .v{font:700 22px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:4px;display:flex;align-items:center;gap:6px}
.walletbar .s{font-size:12px;color:var(--muted)}

.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.offer{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;cursor:pointer;text-align:start;padding:0;transition:transform .15s,border-color .15s}
.offer:hover{transform:translateY(-2px);border-color:var(--accent)}
.offer-art{aspect-ratio:16/10;position:relative;display:grid;place-items:center;overflow:hidden;max-width:100%}
.offer-art .mono{font:800 46px/1 var(--f-display);color:rgba(255,255,255,.92);letter-spacing:-.04em;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.offer-art .tag{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;backdrop-filter:blur(4px)}
.offer-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.offer-body h4{font-family:var(--f-body);font-size:15px;font-weight:800;letter-spacing:0}
.offer-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.offer-foot .amt{font-size:16px}
.appicon{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font:800 24px/1 var(--f-display);color:#fff;flex:none}

.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.wall{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.wall:hover{border-color:var(--accent)}
.wall .wl{font:800 18px/1 var(--f-display);letter-spacing:-.02em}
.wall .bar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.wall .bar i{display:block;height:100%;background:var(--accent)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.split{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.methodpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mp{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;position:relative}
.mp.on{border-color:var(--accent)}
.mp[disabled]{opacity:.5;cursor:not-allowed}
.amtpick{display:flex;gap:8px;flex-wrap:wrap}
.amtpick button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:700 14px/1 var(--f-mono);cursor:pointer}
.amtpick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.chest{display:flex;gap:18px;align-items:center;padding:20px;border-radius:var(--r);background:linear-gradient(120deg,var(--coin-soft),var(--accent-soft));border:1px solid var(--line)}
.chest-ico{width:64px;height:64px;border-radius:16px;background:var(--coin-face);display:grid;place-items:center;color:#6B4300;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.chest-ico svg{width:34px;height:34px;stroke-width:2}

.lvl{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--coin-face))}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pod{padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pod .rk{font:800 34px/1 var(--f-display)}
.pod.g1{border-color:var(--coin-face)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* modal + toast */
.backdrop{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .18s}
.modal.wide{max-width:760px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h3{font-size:20px}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:16px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.toasts{position:fixed;z-index:200;top:calc(76px + env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:340px;animation:pop .2s;display:flex;gap:10px;align-items:center}
.toast.good{background:var(--good);color:#fff}
.toast.bad{background:var(--bad);color:#fff}

/* demo bar */
.demobar{position:fixed;z-index:150;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));font-family:var(--f-ar);direction:rtl}
.demobtn{display:flex;align-items:center;gap:8px;background:var(--ink-band);color:var(--ink-band-fg);border:1px solid var(--line);border-radius:99px;padding:10px 16px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);font-size:14px}
.demobtn i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}

  const t=addTx(u.id,type,desc,coins,hold?'pending':'credited',{...(extra||{}),release:hold?now()+S.settings.holdDays*DAY:null});

function chartSVG(series,keys,colors,h){
  h=h||220;const W=640,P={l:44,r:12,t:12,b:26};
  const max=Math.max(...series.flatMap(d=>keys.map(k=>d[k])));const step=max>400?200:max>200?100:50;const top=Math.ceil(max/step)*step;
  const x=i=>P.l+i*(W-P.l-P.r)/(series.length-1),y=v=>P.t+(h-P.t-P.b)*(1-v/top);
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-8}" y="${y(v)+4}" text-anchor="end">$${v}</text>`;
  series.forEach((d,i)=>{if((i%7===0&&series.length-1-i>3)||i===series.length-1)g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${new Date(d.d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</text>`});
  keys.forEach((k,j)=>{const pts=series.map((d,i)=>`${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`);
    if(j===0)g+=`<path d="M${pts[0]} L${pts.join(' L')} L${x(series.length-1)},${y(0)} L${x(0)},${y(0)}Z" fill="${colors[j]}" opacity=".12"/>`;
    g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${colors[j]}" stroke-width="2.2" stroke-linejoin="round"/>`;
    const L=series[series.length-1];g+=`<circle cx="${x(series.length-1)}" cy="${y(L[k])}" r="4" fill="${colors[j]}"/>`});
  return `<div style="overflow-x:auto;direction:ltr"><svg viewBox="0 0 ${W} ${h}" style="width:100%;min-width:480px;height:auto;display:block">${g}</svg></div>`;
}
function stats(){
  const live=S.postbacks.filter(p=>p.live);
  const rev=S.series.reduce((a,d)=>a+d.rev,0)+live.reduce((a,p)=>a+p.payout,0);
  const paidOut=S.withdrawals.filter(w=>w.status==='paid').reduce((a,w)=>a+w.usd,0);
  const userCost=S.series.reduce((a,d)=>a+d.paid,0)+live.reduce((a,p)=>a+p.coins/S.settings.coinsPerUSD,0);
  const rv=S.series.reduce((a,d)=>a+d.rv,0)+S.postbacks.filter(p=>p.live&&p.status==='reversed').reduce((a,p)=>a+p.payout,0);
  const pend=S.withdrawals.filter(w=>w.status==='pending');
  const liability=S.users.reduce((a,u)=>a+u.balance+u.pending,0)/S.settings.coinsPerUSD;
  return {rev,paidOut,userCost,rv,net:rev-userCost-rv,pend,pendUSD:pend.reduce((a,w)=>a+w.usd,0),liability,active:S.users.filter(u=>now()-u.lastSeen<7*DAY).length};
}

  offerEdit:d=>offerEditModal(d.id),
  offerDelete:d=>{S.offers=S.offers.filter(o=>o.id!==d.id);closeModal();render();toast('تم حذف العرض')},
  reverse:d=>{const p=S.postbacks.find(x=>x.id===d.id);p.status='reversed';const u=userById(p.uid);
    if(u){const t=p.tx&&S.tx.find(x=>x.id===p.tx);if(t&&t.status==='pending'){u.pending=Math.max(0,u.pending-t.coins);t.status='reversed'}else{u.balance-=p.coins;if(t)t.status='reversed'}
      addTx(u.id,'reversal','Reversed by advertiser · '+p.offer,-p.coins,'reversed');u.risk=Math.min(99,u.risk+15);if(!u.flags.includes('Reversal'))u.flags.push('Reversal')}
    render();toast('تم الاسترداد وخصم '+fmt(p.coins)+' كوين من المستخدم')}
};
const FORM={
  signup:(f)=>{const name=(f.get('name')||'').trim(),email=(f.get('email')||'').trim(),pass=f.get('pass')||'';const err=$('#auth-err');
    if(name.length<2)return err.textContent='Enter a display name with at least 2 characters.';
    if(!/^\S+@\S+\.\S+$/.test(email))return err.textContent='Enter a valid email address, like you@email.com.';
    if(pass.length<8)return err.textContent='Your password needs at least 8 characters.';
    if(!f.get('age'))return err.textContent=`Confirm that you are ${S.settings.minAge} or older to continue.`;
    if(S.users.some(u=>u.email.toLowerCase()===email.toLowerCase()))return err.textContent='An account with this email already exists. Log in instead.';
    const u=createUser(name,email,f.get('country'),f.get('ref'));closeModal();go('earn');toast(`Welcome, ${name.split(' ')[0]}! ${fmt(S.settings.welcomeBonus)} coins added`,'good');if(u.refBy)toast('Referral code applied')},
  login:(f)=>{const email=(f.get('email')||'').trim().toLowerCase();const u=S.users.find(x=>x.email.toLowerCase()===email);const err=$('#auth-err');
    if(!u)return err.textContent='No account uses this email. Check the spelling or create an account.';
    if(u.status==='banned')return err.textContent='This account is suspended. Contact support for details.';
    S.me=u.id;closeModal();go('earn')},
  promo:(f)=>{const code=(f.get('code')||'').trim().toUpperCase();const p=S.promos.find(x=>x.code===code);const u=me();
    if(!p||!p.on)return toast('That code is not valid or has expired','bad');
    if(p.uses>=p.max)return toast('This code has reached its limit','bad');
    if(S.tx.some(t=>t.uid===u.id&&t.type==='promo'&&t.code===code))return toast('You already used this code','bad');
    p.uses++;credit(u,p.coins,'promo','Promo code '+code,{code});render();toast(`+${fmt(p.coins)} coins from ${code}`,'good')},
  withdraw:(f)=>{const u=me();const addr=(f.get('addr')||'').trim();const m=ui.method,st=S.settings.methods[m];const usd=ui.amount;const coins=usd*S.settings.coinsPerUSD;
    if(u.status==='banned')return toast('Your account is suspended','bad');
    if(vpnBlocked())return toast('Turn off your VPN to cash out','bad');
    if(addr.length<6)return toast('Enter your '+METHODS[m].field.toLowerCase(),'bad');
    if(u.balance<coins)return toast('Not enough coins for this amount','bad');
    u.balance-=coins;
    const auto=u.paidOnce&&usd<=S.settings.autoApproveUnderUSD&&u.risk<50&&!u.flags.length;
    const first=!u.paidOnce;
    const w={id:id('w'),uid:u.id,method:m,usd,coins,addr,status:auto?'paid':'pending',ts:now(),note:'',first};
    S.withdrawals.unshift(w);addTx(u.id,'withdraw','Withdrawal · '+METHODS[m].name,-coins,auto?'paid':'pending',{wid:w.id});
    if(auto)u.paidOnce=true;
    render();toast(auto?`${money(usd)} sent to your ${METHODS[m].name}`:`Withdrawal requested. ${first&&S.settings.firstWithdrawManual?'We review first payouts within 24 hours.':'Processing now.'}`,'good')},
  profile:(f)=>{const u=me();const n=(f.get('name')||'').trim();if(n.length<2)return toast('Display name needs 2+ characters','bad');u.name=n;u.email=(f.get('email')||u.email).trim();u.twofa=!!f.get('twofa');render();toast('Changes saved','good')},
  ticket:(f)=>{const body=(f.get('body')||'').trim();if(body.length<10)return toast('Add a few more details so we can help','bad');S.tickets.unshift({id:id('k'),uid:S.me,subject:f.get('subject'),body,status:'open',ts:now(),replies:[]});render();toast('Message sent. We usually reply within a few hours','good')},
  adminLogin:(f)=>{if(f.get('email')==='admin@amigo.cash'&&f.get('pass')==='admin123'){S.admin=true;render()}else $('#a-err').textContent='البيانات غير صحيحة'},
  userSearch:(f)=>{ui.userQ=f.get('q')||'';render();const i=$('#a-q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},
  adjust:(f)=>{const u=userById(f.get('uid'));const c=parseInt(f.get('coins'),10);if(!c)return toast('أدخل عدد كوينز','bad');u.balance+=c;if(c>0)u.earned+=c;addTx(u.id,'adjust',(f.get('reason')||'Balance adjustment by support'),c,'credited');render();userDetail(u.id);toast('تم تعديل الرصيد '+(c>0?'+':'')+fmt(c),'good')},
  wdReject:(f)=>{const w=S.withdrawals.find(x=>x.id===f.get('id'));w.status='rejected';w.note=f.get('reason');const u=userById(w.uid);if(u){u.balance+=w.coins;addTx(u.id,'adjust','Refund · withdrawal rejected: '+w.note,w.coins,'credited')}S.tx.forEach(t=>{if(t.wid===w.id)t.status='reversed'});closeModal();render();toast('تم الرفض وإرجاع الرصيد')},
  offerSave:(f)=>{const idv=f.get('id');const steps=(f.get('steps')||'').split('\n').map(l=>l.split('|')).filter(a=>a[0].trim()).map(a=>[a[0].trim(),(parseFloat(a[1])||0)/100]);
    const tot=steps.reduce((a,s)=>a+s[1],0);if(!steps.length||Math.abs(tot-1)>0.02)return toast('مجموع نسب المراحل لازم يساوي 100% (حالياً '+Math.round(tot*100)+'%)','bad');
    const data={title:f.get('title').trim(),net:f.get('net'),cat:f.get('cat'),payout:+f.get('payout'),color:f.get('color'),days:+f.get('days')||14,countries:(f.get('countries')||'').toUpperCase().split(/[\s,]+/).filter(Boolean),desc:f.get('desc'),steps};
    if(!data.title)return toast('اكتب اسم العرض','bad');
    if(idv){Object.assign(S.offers.find(o=>o.id===idv),data)}else S.offers.unshift({id:id('o'),on:true,featured:true,platform:'Android · iOS',completions:0,...data});
    closeModal();render();toast('تم حفظ العرض','good')},
  netSave:(f)=>{const n=netById(f.get('id'));n.on=!!f.get('on');const sh=f.get('share');n.share=sh===''?null:Math.max(0,Math.min(100,+sh));n.secret=f.get('secret');render();toast('تم حفظ إعدادات '+n.name,'good')},
  fraudSave:(f)=>{const st=S.settings;st.blockVPN=!!f.get('blockVPN');st.firstWithdrawManual=!!f.get('firstWithdrawManual');['holdThresholdUSD','holdDays','autoApproveUnderUSD','maxAccountsPerDevice','autoBanRisk'].forEach(k=>st[k]=+f.get(k));render();toast('تم حفظ القواعد','good')},
  promoNew:(f)=>{const code=(f.get('code')||'').trim().toUpperCase().replace(/\s/g,'');if(!code)return;if(S.promos.some(p=>p.code===code))return toast('الكود موجود','bad');S.promos.unshift({code,coins:+f.get('coins')||0,uses:0,max:+f.get('max')||1,on:true});render();toast('تم إنشاء الكود '+code,'good')},
  reply:(f)=>{const t=S.tickets.find(x=>x.id===f.get('id'));const text=(f.get('text')||'').trim();if(!text)return toast('اكتب الرد','bad');t.replies.push({from:'admin',text,ts:now()});t.status='closed';render();toast('تم إرسال الرد','good')},
  siteSave:(f)=>{const st=S.settings;['coinsPerUSD','userShare','refPercent','welcomeBonus','dailyMin','dailyMax','gameBoost'].forEach(k=>st[k]=Math.max(0,+f.get(k)||0));
    if(st.coinsPerUSD<1)st.coinsPerUSD=1;st.userShare=Math.min(100,st.userShare);
    st.prizes=(f.get('prizes')||'').split(',').map(x=>+x||0);
    Object.keys(METHODS).forEach(m=>{st.methods[m].on=!!f.get('on_'+m);st.methods[m].min=Math.max(0.5,+f.get('min_'+m)||1)});
    st.banner.on=!!f.get('bannerOn');st.banner.text=f.get('bannerText')||'';st.registration=!!f.get('registration');st.maintenance=!!f.get('maintenance');st.supportEmail=f.get('supportEmail');
    render();toast('تم حفظ الإعدادات وتطبيقها على الموقع','good')}
};
const CHG={
  offerFeat:el=>{S.offers.find(o=>o.id===el.dataset.id).featured=el.checked;save()},
  offerOn:el=>{S.offers.find(o=>o.id===el.dataset.id).on=el.checked;save();toast(el.checked?'العرض ظاهر للمستخدمين':'العرض مخفي')},
  promoOn:el=>{S.promos.find(p=>p.code===el.dataset.code).on=el.checked;save()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;if(el.dataset.act!=='closeBackdrop'||e.target===el)e.preventDefault();fn(el.dataset,el,e)});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();FORM[f.dataset.form](new FormData(f),f)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el)CHG[el.dataset.change](el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* auto-release holds that have passed their date */
S.users.forEach(u=>{S.tx.forEach(t=>{if(t.uid===u.id&&t.status==='pending'&&t.release&&t.release<now()){t.status='credited';u.pending=Math.max(0,u.pending-t.coins);u.balance+=t.coins}})});
/* refresh ticker contents now and then without re-rendering the page */
setInterval(()=>{const t=document.querySelector('.ticker-in');if(t&&!document.hidden){/* keep animation running; content refresh only on navigation */}},10000);
render();
})();
</script>
